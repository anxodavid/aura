name: CI

# Este workflow verifica. El de Pages despliega. Se mantienen separados a propósito:
# aquí interesa saber si algo está roto, incluso en ramas que nunca se despliegan.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      # El test de golden es lo que garantiza que el motor sigue puntuando igual
      # y que el análisis no hace ni una petición de red.
      - name: Tests
        working-directory: client
        run: npm test

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Formato
        working-directory: client
        run: npm run format:check

      # Compilar en CI detecta lo que el lint no ve: importaciones que no resuelven,
      # activos que faltan, configuración de Vite rota.
      - name: Build
        working-directory: client
        run: npm run build
